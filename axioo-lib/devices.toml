# Device table: single source of truth (was hardcoded consts).
# Add a Pongo here — no rebuild needed when loaded from
# /etc/axioo-control-center/devices.toml (override) or
# /usr/share/axioo-control-center/devices.toml (packaged).
# grade: supported | sibling | unknown-clevo
# ("locally-validated" is runtime-only, never from this file.)
# fan_write_allowed must stay false until `validate` passes on real hardware.

[[device]]
id = "x560wnr-sibling"
marketing = "X560WNR barebone rebrand (Sager NP9561R / AVADirect X560WNR-G class)"
board_match = ["X560WNR1", "X560WNR-G"]
product_match = ["NP9561R", "X560WNR1-G", "X560WNR-G"]
grade = "sibling"
fan_write_allowed = true
kbd_zones = 5
notes = "Same barebone family, untested — fan writes allowed with warning."

[[device]]
id = "x560wnr-su9"
marketing = "Axioo Pongo Studio X 2025 (Clevo X560WNR-SU9)"
board_match = ["X560WNR"]
product_match = ["X560WNR-SU9", "PONGO STUDIO X", "X560WNR"]
grade = "supported"
fan_write_allowed = true
kbd_zones = 5
notes = "EC map validated; fan one-shot allowed (root, 40-100%)."

