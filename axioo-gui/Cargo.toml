[package]
name = "axioo-gui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "GPUI desktop GUI for axioo-control-center (Axioo / Clevo Linux control)"

[[bin]]
name = "axioo-control-center"
path = "src/main.rs"

[dependencies]
axioo-lib = { path = "../axioo-lib" }
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
