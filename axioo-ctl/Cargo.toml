[package]
name = "axioo-ctl"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Linux control utility for Axioo Pongo / Clevo laptops (read-only MVP: probe + monitor)"

[[bin]]
name = "axioo-ctl"
path = "src/main.rs"

[dependencies]
axioo-lib = { path = "../axioo-lib" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
zbus = "5"
ctrlc = "3"
