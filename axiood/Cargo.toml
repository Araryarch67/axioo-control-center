[package]
name = "axiood"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Privileged daemon for Axioo laptops: EC fan-curve loop + RAPL, two-way sync with power-profiles-daemon"

[[bin]]
name = "axiood"
path = "src/main.rs"

[dependencies]
axioo-lib = { path = "../axioo-lib" }
zbus = "5"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
