<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- axiood owns com.axioo.Control on the system bus -->
  <policy user="root">
    <allow own="com.axioo.Control"/>
    <allow send_destination="com.axioo.Control"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.axioo.Control"/>
    <deny own="com.axioo.Control"/>
  </policy>
</busconfig>
